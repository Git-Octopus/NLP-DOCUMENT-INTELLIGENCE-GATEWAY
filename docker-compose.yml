# ==============================================================================
# Docker Compose: NLP Document Intelligence Gateway Ecosystem
# Services:
#   1. qdrant   - Vector Database for Topic Classification & Duplicate Detection
#   2. api      - FastAPI Intelligence Gateway (NLP Pipeline + Vector Retrieval)
#   3. ui       - Streamlit Interactive Dashboard & Analytics Workbench
# ==============================================================================

version: '3.8'

services:
  # ----------------------------------------------------------------------------
  # 1. Qdrant Vector Database
  # ----------------------------------------------------------------------------
  qdrant:
    image: qdrant/qdrant:v1.10.0
    container_name: nlp_gateway_qdrant
    restart: unless-stopped
    ports:
      - "6333:6333"   # REST API
      - "6334:6334"   # gRPC API
    volumes:
      - qdrant_storage:/qdrant/storage
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:6333/readyz || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ----------------------------------------------------------------------------
  # 2. FastAPI Document Intelligence Gateway
  # ----------------------------------------------------------------------------
  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: nlp_gateway_api
    restart: unless-stopped
    depends_on:
      qdrant:
        condition: service_healthy
    ports:
      - "8000:8000"
    environment:
      - QDRANT_URL=http://qdrant:6333
      - LLM_PROVIDER=${LLM_PROVIDER:-gemini}
      - GEMINI_API_KEY=${GEMINI_API_KEY:-}
      - OPENAI_API_KEY=${OPENAI_API_KEY:-}
      - EMBEDDING_MODEL_NAME=all-MiniLM-L6-v2
      - DUPLICATE_SIMILARITY_THRESHOLD=0.85
    command: ["uvicorn", "app.main:app", "--host", "0.0.0.0", "--port", "8000"]
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 15s
      timeout: 5s
      retries: 3

  # ----------------------------------------------------------------------------
  # 3. Streamlit Interactive Dashboard
  # ----------------------------------------------------------------------------
  ui:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: nlp_gateway_ui
    restart: unless-stopped
    depends_on:
      api:
        condition: service_started
    ports:
      - "8501:8501"
    environment:
      - API_BASE_URL=http://api:8000
    command: ["streamlit", "run", "streamlit_app/app.py", "--server.port", "8501", "--server.address", "0.0.0.0"]

volumes:
  qdrant_storage:
    driver: local
